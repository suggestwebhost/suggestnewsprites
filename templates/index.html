<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Gallery</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid #2e2e38;
            padding-bottom: 1rem;
        }

        h1 { margin: 0; font-size: 2rem; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
        }

        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-download {
            background-color: #27272a;
            color: var(--text-main);
            border: 1px solid #3f3f46;
            width: 100%;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .btn-download:hover {
            background-color: #3f3f46;
            border-color: #52525b;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2e2e38;
            display: flex;
            flex-direction: column;
        }

        .image-wrapper {
            background-color: #18181b;
            background-image: linear-gradient(45deg, #27272a 25%, transparent 25%), 
                              linear-gradient(-45deg, #27272a 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #27272a 75%), 
                              linear-gradient(-45deg, transparent 75%, #27272a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated; /* Perfect for crisp sprite art */
        }

        .card-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.2rem;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sprite Vault</h1>
            <a href="{{ url_for('upload_page') }}" class="btn btn-primary">+ Upload New</a>
        </header>

        <div class="grid">
            {% for sprite in sprites %}
            <div class="card">
                <div class="image-wrapper">
                    <img src="{{ sprite.image_url }}" alt="{{ sprite.name }}">
                </div>
                <div class="card-info">
                    <h3 class="card-title">{{ sprite.name }}</h3>
                    <p class="card-desc">{{ sprite.description or 'No description provided.' }}</p>
                    <a href="{{ url_for('download_sprite', sprite_id=sprite._id) }}" class="btn btn-download">
                        📥 Download Asset
                    </a>
                </div>
            </div>
            {% else %}
            <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">
                No sprites uploaded yet. Get started by clicking upload above!
            </p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
