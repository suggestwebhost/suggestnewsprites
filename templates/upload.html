<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Sprite</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --border-color: #3f3f46;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid #2e2e38;
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h2 { margin-top: 0; margin-bottom: 1.5rem; }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #18181b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea { resize: vertical; min-height: 80px; }

        .actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-submit { background-color: var(--accent); color: white; }
        .btn-submit:hover { background-color: var(--accent-hover); }
        
        .btn-cancel { background-color: transparent; color: #a1a1aa; border: 1px solid #3f3f46; }
        .btn-cancel:hover { background-color: #27272a; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Upload New Sprite</h2>
        <form action="{{ url_for('upload_sprites') }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Sprite Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g., Hero Idle Animation">
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" name="description" placeholder="Describe your asset..."></textarea>
            </div>

            <div class="form-group">
                <label for="file">Asset File Image</label>
                <input type="file" id="file" name="file" accept="image/*" required>
            </div>

            <div class="actions">
                <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-submit">Upload to Vault</button>
            </div>
        </form>
    </div>
</body>
</html>
